<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../style.css">
    <title>Registro</title>
</head>

<body>
    <h1>Registro</h1>
    <form id="form"> 
        <div> 
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="off" placeholder="example@example.com">
        </div>
        <div>   
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="off" placeholder="*******">
        </div>
        <button type="submit">Ingresar</button>
    </form>

    <p>¿Ya tenés cuenta? <a href="/src/pages/auth/login/login.html">Iniciá sesión</a></p>

    <script type="module" src="./registro.ts"></script>
</body>

</html>
